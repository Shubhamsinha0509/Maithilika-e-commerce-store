<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isFish }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M5 24 C13 12 29 12 37 24 C29 36 13 36 5 24 Z"></path><path d="M37 24 L45 15 L45 33 Z"></path><circle cx="12.5" cy="22" r="1.8"></circle><path d="M19 17.5 C22.5 21 22.5 27 19 30.5"></path><path d="M25 16.5 C28.5 21 28.5 27 25 31.5"></path><path d="M31 18.5 C33.5 22 33.5 26 31 29.5"></path></svg></sc-if>
<sc-if value="{{ isLotus }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M24 7 C31 15 31 28 24 37 C17 28 17 15 24 7 Z"></path><path d="M24 37 C14 35 7 27 6 17 C15 19 21 26 24 37 Z"></path><path d="M24 37 C34 35 41 27 42 17 C33 19 27 26 24 37 Z"></path><path d="M24 15 V30"></path><path d="M10 42 H38"></path></svg></sc-if>
<sc-if value="{{ isSun }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:block"><circle cx="24" cy="24" r="9"></circle><circle cx="24" cy="24" r="4"></circle><path d="M24 4 V11 M24 37 V44 M4 24 H11 M37 24 H44 M10 10 L15 15 M33 33 L38 38 M38 10 L33 15 M15 33 L10 38"></path></svg></sc-if>
<sc-if value="{{ isPeacock }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 48 48" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:block"><circle cx="12" cy="10" r="3"></circle><path d="M12 5 L10 2 M12 5 L14 2"></path><path d="M9 10 L6 11"></path><path d="M13 13 C13 20 15 26 21 30"></path><path d="M21 30 C25 23 33 23 35 30 C33 37 25 38 21 30 Z"></path><path d="M35 30 L40 17 M35 30 L44 27 M35 30 L41 40"></path><circle cx="40.5" cy="15.5" r="2.5"></circle><circle cx="44" cy="26.5" r="2.5"></circle><circle cx="41.5" cy="41" r="2.5"></circle><path d="M24 37 L22 44 M30 37 L31 44"></path></svg></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;motif&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fish&quot;,&quot;lotus&quot;,&quot;sun&quot;,&quot;peacock&quot;],&quot;default&quot;:&quot;fish&quot;,&quot;tsType&quot;:&quot;'fish'|'lotus'|'sun'|'peacock'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.motif || 'fish';
    return { isFish: m === 'fish', isLotus: m === 'lotus', isSun: m === 'sun', isPeacock: m === 'peacock' };
  }
}
</script>
</body>
</html>
